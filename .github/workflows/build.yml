name: build-sentencepiece
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-24.04-arm
    container: python:3.12-alpine
    steps:
      - run: apk add --no-cache gcc g++ make cmake git
      - run: mkdir -p /out
      - run: pip wheel sentencepiece --no-deps -w /out
      - uses: actions/upload-artifact@v4
        with:
          name: sentencepiece-wheel
          path: /out/*.whl
